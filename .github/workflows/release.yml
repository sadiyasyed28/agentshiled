name: Release SDK to PyPI

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (build, test, and validate only; do not publish)"
        required: true
        type: boolean
        default: true
      confirm:
        description: "Confirmation token (type 'RELEASE-0.1.0' to authorize publishing)"
        required: true
        type: string
        default: "DRY-RUN"

jobs:
  build-and-verify:
    name: Build & Validate Distribution
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build sdist and wheel
        run: |
          python -m build

      - name: Validate distribution metadata with Twine
        run: |
          twine check dist/*.whl dist/*.tar.gz

      - name: Test clean wheel installation in isolated environment
        run: |
          python -m venv test_env
          test_env/bin/pip install --upgrade pip
          test_env/bin/pip install dist/*.whl
          test_env/bin/python -c "
          import agentshield
          print('Successfully imported AgentShield version:', agentshield.__version__)
          assert agentshield.__version__ == '0.1.0'
          from agentshield import Shield, PolicyConfiguration, DecisionValue
          policy = PolicyConfiguration.from_dict({
              'agents': {'test_agent': {'allowed_tools': ['ping']}},
              'tools': {'ping': {}},
          })
          shield = Shield(policy=policy)
          shield.registry.register('ping', lambda args: {'pong': True})
          res = shield.execute(agent='test_agent', tool='ping', arguments={})
          assert res.decision.decision == DecisionValue.ALLOW
          assert res.tool_result == {'pong': True}
          print('Core SDK smoke test succeeded!')
          "

      - name: Store distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
          retention-days: 5

  publish-pypi:
    name: Publish to PyPI (Trusted Publishing via OIDC)
    needs: [build-and-verify]
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.dry_run == false && github.event.inputs.confirm == 'RELEASE-0.1.0' }}
    environment:
      name: pypi
      url: https://pypi.org/p/agentshield
    permissions:
      id-token: write  # Mandatory for PyPI Trusted Publishing (OIDC)

    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish package distribution to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          verbose: true
