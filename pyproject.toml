[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agentshield"
version = "0.1.0"
description = "Open-source, framework-independent Python runtime security SDK for tool-using AI agents."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "AgentShield Contributors" }
]
keywords = [
    "security",
    "ai-agents",
    "llm",
    "runtime-security",
    "tool-use",
    "policy-enforcement",
    "guardrails",
    "langchain",
    "crewai",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "pydantic>=2.0",
]

[project.urls]
Homepage = "https://agentshiled.vercel.app"
Repository = "https://github.com/sadiyasyed28/agentshiled"
Issues = "https://github.com/sadiyasyed28/agentshiled/issues"
Documentation = "https://github.com/sadiyasyed28/agentshiled#readme"

[project.optional-dependencies]
yaml = [
    "pyyaml>=6.0",
]
server = [
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
]
postgres = [
    "psycopg[binary]>=3.1.0",
]
gemini = [
    "google-genai>=0.1.0",
]
langchain = [
    "langchain-core>=0.2.0",
]
crewai = [
    "crewai>=0.28.0; python_version < '3.14'",
]
all = [
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "psycopg[binary]>=3.1.0",
    "google-genai>=0.1.0",
    "pyyaml>=6.0",
    "langchain-core>=0.2.0",
    "crewai>=0.28.0; python_version < '3.14'",
]
dev = [
    "pytest>=7.0",
    "httpx>=0.24.0",
    "pyyaml>=6.0",
    "langchain-core>=0.2.0",
    "crewai>=0.28.0; python_version < '3.14'",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["agentshield*"]
exclude = ["components*", "assets*", "hooks*", "api*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
