[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agentshield"
version = "0.1.0"
description = "An open-source runtime security and control layer for AI agents."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
]

[project.optional-dependencies]
yaml = [
    "pyyaml>=6.0",
]
server = [
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
]
postgres = [
    "psycopg[binary]>=3.1.0",
]
gemini = [
    "google-genai>=0.1.0",
]
langchain = [
    "langchain-core>=0.2.0",
]
crewai = [
    "crewai>=0.28.0; python_version < '3.14'",
]
all = [
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "psycopg[binary]>=3.1.0",
    "google-genai>=0.1.0",
    "pyyaml>=6.0",
    "langchain-core>=0.2.0",
    "crewai>=0.28.0; python_version < '3.14'",
]
dev = [
    "pytest>=7.0",
    "httpx>=0.24.0",
    "pyyaml>=6.0",
    "langchain-core>=0.2.0",
    "crewai>=0.28.0; python_version < '3.14'",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["agentshield*"]
exclude = ["components*", "assets*", "hooks*", "api*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
